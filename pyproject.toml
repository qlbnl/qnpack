[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qnpack"
version = "1.2.0"
description = "Quantum Network Repeater Simulation Package"
readme = "README.md"
license = "BSD-3-Clause-LBNL"
license-files = ["LICENSE", "COPYRIGHT"]
requires-python = ">=3.7"
authors = [
    { name = "Charu Jain" },
    { name = "Chuen Hei Chan" },
    { name = "Ezra Kissel" },
    { name = "Wenji Wu" },
]
maintainers = [
    { name = "qnpack", email = "qnpack@es.net" },
]
keywords = ["quantum", "network", "repeater", "photonic", "simulation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/quant-net/repeater-simulations"

[project.scripts]
qnpack = "qnpack.qnpack:main"
dqc-sim = "qnpack.dqc.sim:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["qnpack", "qnpack.*"]
