---
asyncapi: "2.6.0"
id: "urn:gov:quant-net"
info:
  description: "Quant-Net RPC Distributed Quantum Computing (DQC) Protocol"
  title: "RPC DQC Endpoint"
  version: "1.0.0"
components:
  messages:
    RequestMessage:
      name: dqcRequest
      messageId: dqc.request.id
      payload:
        "$ref": "#/components/schemas/DQCRequest"
    ResponseMessage:
      name: dqcResponse
      messageId: dqc.response.id
      payload:
        "$ref": "#/components/schemas/DQCResponse"
  schemas:
    DQCRequest:
      title: dqcRequest
      type: object
      required:
        - cmd
        - agentId
        - payload
      properties:
        cmd:
          type: string
        agentId:
          type: string
        payload:
          type: object
          required:
            - commands
          properties:
            commands:
              type: array  # Flat array of commands
              items:
                type: object
                properties:
                  timeslot:
                    type: integer
                  qpu_id:
                    type: string
                  qpu_name:
                    type: string
                  command:
                    type: string
                  params:
                     type: array
                     items:
                       type: number
                  qubits:
                     type: array
                     items:
                       type: integer
                  original_qubits:
                     type: array
                     items:
                       type: string
                  qpus_involved:
                    type: array
                    items:
                      type: string
                  qubit_info:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
    DQCResponse:
      title:  dqcResponse
      type: object
      required:
        - status
      properties:
        status:
          $ref: "qn-schema:objects/objects.yaml#/components/schemas/Status"
        rid:
          type: string
        data:
          type: object  # Allocation details
defaultContentType: application/json
